schema_version: "1.1"
context:
  scaffold_script: ../scaffold/default.sh
postcheck: ./postcheck.sh
tier: medium
notes: |
  The refactor twin of the private-leaf review case. The quickfix command gets
  src/services/transport/webhook.ts and its test. The run has no user, so it fixes every finding and defers none. The case
  measures the rule and not the defer path. The right move is a new public module, beside the I/O one or below it,
  for expandEnv, with its own tests, and trimSlash stays private in the I/O file.
  The wrong moves are a test-only export, or a private function kept in place.
  Grader 30a checks that the run calls Stryker or writes a mutation-not-run row. The mutation step
  runs Stryker when it is present. A mutation-not-run row in the ledger is expected when Stryker is absent.
  The postcheck builds, tests, checks the new module for its own tests and full
  coverage, checks that the old name is gone and that no test-only export exists,
  and counts the commits.
