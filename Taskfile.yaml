version: '3'

includes:
  go:
    taskfile: go/Taskfile.yaml
  py:
    taskfile: py/Taskfile.yaml
  ts-react:
    taskfile: ts-react/Taskfile.yaml

vars:
  # Path to the plugin directory a run measures. Each suite's Taskfile defaults
  # its own PLUGIN to the sibling checkout of weka/linter-driven-development and lets
  # PLUGIN=<dir> on the command line win. The include must not set PLUGIN: a
  # var passed through an include's vars block shadows the command line for
  # every task in that suite, so PLUGIN=<dir> would be ignored.
  GO_PLUGIN: '{{.PLUGIN | default (printf "%s/../linter-driven-development/go-linter-driven-development" .ROOT_DIR)}}'
  # Agent model. Always pinned on the command line so a baseline names it.
  MODEL: '{{.MODEL | default "claude-sonnet-5"}}'
  # The runner's linter, pinned like the go-mini fixture's: the same version on
  # the same Go toolchain, installed once into .bin/.
  GOLANGCI_LINT_VERSION: v2.11.4
  LINT_GO_TOOLCHAIN: go1.26.10
  GOLANGCI_LINT: '{{.ROOT_DIR}}/.bin/golangci-lint-{{.GOLANGCI_LINT_VERSION}}'

tasks:
  build:
    desc: Build the runner into bin/ldd-eval
    cmds:
      - cd runner && go build -o ../bin/ldd-eval .
    sources:
      - runner/**/*.go
      - runner/go.mod
      - runner/go.sum
    generates:
      - bin/ldd-eval

  test:
    desc: Run the runner's tests
    cmds:
      - cd runner && go test ./...

  install-golangci-lint:
    internal: true
    desc: Install the pinned golangci-lint into .bin once
    cmds:
      - mkdir -p .bin
      - |
        tmp=$(mktemp -d .bin/.install.XXXXXX)
        trap 'rm -rf "$tmp"' EXIT
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$tmp" {{.GOLANGCI_LINT_VERSION}}
        mv "$tmp/golangci-lint" {{.GOLANGCI_LINT | shellQuote}}
    status:
      - test -x {{.GOLANGCI_LINT | shellQuote}}

  lint:
    desc: Lint the runner
    deps: [install-golangci-lint]
    cmds:
      - cd runner && GOTOOLCHAIN={{.LINT_GO_TOOLCHAIN}} {{.GOLANGCI_LINT | shellQuote}} run ./...

  docs:check:
    desc: Run the Go plugin's documentation conformance gate over this repository
    cmds:
      - bash scripts/check-docs.sh {{.GO_PLUGIN}}

  leaks:check:
    desc: Fail when a tracked file holds a home path, a Weka email, a connector tool name, a credential or a trace
    cmds:
      - bash scripts/check-leaks.sh
